<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Login</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SQL.js para SQLite no navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="bg-gray-50 flex flex-col items-center justify-center min-h-screen">

  <div class="w-full max-w-sm bg-white border border-gray-300 p-8 rounded mb-3 flex flex-col items-center">
    <!-- Logo do Instagram -->
    <h1 class="text-4xl font-serif mb-8 select-none">Instagram</h1>

    <!-- Form de Login / Cadastro -->
    <form id="auth-form" class="w-full flex flex-col gap-2">
      <input 
        type="text" 
        id="username" 
        placeholder="Nome de usuário" 
        required
        class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-300 rounded focus:outline-none focus:border-gray-400"
      />
      <input 
        type="password" 
        id="password" 
        placeholder="Senha" 
        required
        class="w-full px-3 py-2 text-xs bg-gray-50 border border-gray-300 rounded focus:outline-none focus:border-gray-400"
      />
      <button 
        type="submit" 
        id="btn-login"
        class="w-full bg-blue-500 text-white py-1.5 rounded font-semibold text-sm mt-2 hover:bg-blue-600 transition"
      >
        Entrar
      </button>
      <button 
        type="button" 
        id="btn-register"
        class="w-full bg-gray-200 text-gray-800 py-1.5 rounded font-semibold text-sm mt-1 hover:bg-gray-300 transition"
      >
        Criar Conta
      </button>
    </form>

    <p id="auth-message" class="text-xs text-red-500 mt-4 hidden text-center"></p>
  </div>

  <script type="module" src="./src/controllers/AuthController.js"></script>
</body>
</html>
