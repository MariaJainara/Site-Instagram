<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>
<body class="bg-gray-50 pb-16 md:pb-0">

  <!-- Header Superior -->
  <header class="bg-white border-b border-gray-300 sticky top-0 z-10 px-4 py-3 flex justify-between items-center max-w-xl mx-auto">
    <h1 class="text-2xl font-serif">Instagram</h1>
    <a href="perfil.html" id="nav-user-profile" class="text-xs font-semibold text-gray-700 hover:text-black">Meu Perfil</a>
  </header>

  <!-- Content / Feed -->
  <main id="feed-container" class="max-w-xl mx-auto mt-4 space-y-6 px-2 sm:px-0">
    <!-- Posts serão renderizados via JavaScript -->
  </main>

  <!-- Modal de Compartilhar -->
  <div id="share-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-80 text-center space-y-4">
      <h3 class="font-bold text-lg">Compartilhar Post</h3>
      <p class="text-xs text-gray-500">O link do post foi copiado para a sua área de transferência!</p>
      <button id="close-share-modal" class="w-full bg-blue-500 text-white py-1.5 rounded font-semibold text-sm hover:bg-blue-600">Fechar</button>
    </div>
  </div>

  <script type="module" src="./src/controllers/FeedController.js"></script>
</body>
</html>
